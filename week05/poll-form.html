<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 Poll</title>

    <link rel="stylesheet" href="styles/poll-form.css">

</head>

<body>
    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>POLL QUESTIONS</legend>
                <div class="form-item">
                    <div class="form-item column2">
                        <label for="fullname">Full Name:</label>
                        <input type="text" id="fullname" name="fullname" required>
                    </div>
                    <div class="form-item column2">
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div>
                        <label for="quantity">Select Quantity</label>
                        <select name="quantity" id="quantity">
                            <option value="1">One</option>
                            <option value="2">Two</option>
                            <option value="3">Three</option>
                        </select>
                    </div>
                    <div class="form-item column1">
                        <label for="browser">What is your favorite browser</label>
                        <select name="browser" id="browser">
                            <option value="chrome">Chrome</option>
                            <option value="safari">Safari</option>
                            <option value="edge">Edge</option>
                            <option value="brave">Brave</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-item column1">
                        <label for="pet">Do you have a household pet?</label>
                        <input type="checkbox" id="pet" name="pet">
                    </div>
                    <div>
                        <label for="feedback">List the places you have lived.</label>
                        <textarea name="feedback" name="feedback" rows="4" id="feedback"
                          placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
                    </div>
                </div>
            </fieldset>
            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 WDD130 Jaymar</p>
    </footer>


</body>

</html>
