<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact White Water Rafting to book your guided river trip, ask questions, or get expert advice on planning your whitewater adventure.">
    <meta name="author" content="Jaymar Ruedas Cena">
    <title>About Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr-logo.png" alt="White Water Rafting logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <section class="contact-info">
            <h2>Contact Us</h2>
            <address>
                123 River Rapids Road<br>
                Riverbend, ID 83440<br>
                Phone: <a href="tel:12085551234">(208) 555-1234</a><br>
                Email: <a href="mailto:info@whitewaterrafting.com">info@whitewaterrafting.com</a>
            </address>

            <div class="contact-grid">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31079.88657897927!2d-83.37571277922305!3d34.73651238069054!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8858c6cfe419be07%3A0x482eb1373fc74fce!2sKayaking%20%2F%20Rafting%20Take-out%20on%20Section%20IV%20of%20the%20Chattooga%20River!5e1!3m2!1sen!2sph!4v1785338571120!5m2!1sen!2sph"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin">
                </iframe>

                <form>
                    <fieldset>
                        <legend>Contact Form</legend>

                        <div class="form-item">
                            <label for="name">Name:</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-item">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-item radio-group">
                            <p>Message Purpose</p>
                            <div class="radio-options">
                                <label><input type="radio" id="general" name="purpose"
                                      value="general">General Input</label>
                                <label><input type="radio" id="reservation" name="purpose"
                                      value="reservation">Reservation</label>
                                <label><input type="radio" id="suggestion" name="purpose"
                                      value="suggestion">Website Suggestion</label>
                            </div>
                        </div>

                        <div class="form-item">
                            <label for="message">Message:</label>
                            <textarea name="message" id="message" rows="5" required></textarea>
                        </div>

                        <div class="form-item checkbox-row">
                            <input type="checkbox" id="newsletter" name="newsletter">
                            <label for="newsletter">Please subscribe me to the monthly
                                newsletter</label>
                        </div>

                        <button type="submit">Get in Touch</button>
                    </fieldset>
                </form>
            </div>
        </section>
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-gallery">
                <figure>
                    <img src="images/Head Guide.jpg" alt="Photo of Casey Waters">
                    <figcaption>Casey Waters &mdash; Head Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/Trip Coordinator.jpg" alt="Photo of Morgan Rapids">
                    <figcaption>Morgan Rapids &mdash; Trip Coordinator</figcaption>
                </figure>
                <figure>
                    <img src="images/Safety Instructor.jpg" alt="Photo of Jordan Rivers">
                    <figcaption>Jordan Rivers &mdash; Safety Instructor</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 White Water Rafting. Site by Jaymar Ruedas Cena.</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/">
                <img src="images/fb-logo.png" alt="Facebook Icon">
            </a>
            <a href="https://www.instagram.com/">
                <img src="images/ig-logo.png" alt="Instagram Icon">
            </a>
            <a href="https://x.com/">
                <img src="images/x-logo.png" alt="Twitter Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
